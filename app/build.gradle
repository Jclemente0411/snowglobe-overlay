plugins { id 'com.android.application' }
android {
 namespace 'com.snowglobe.overlay'
 compileSdk 35
 defaultConfig { applicationId 'com.snowglobe.overlay'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.2.1' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 signingConfigs {
   release {
     if (System.getenv('PLAY_STORE_FILE')) {
       storeFile file(System.getenv('PLAY_STORE_FILE'))
       storePassword System.getenv('PLAY_STORE_PASSWORD')
       keyAlias System.getenv('PLAY_KEY_ALIAS')
       keyPassword System.getenv('PLAY_KEY_PASSWORD')
     }
   }
 }
 buildTypes {
   release {
     signingConfig signingConfigs.release
     minifyEnabled false
   }
 }
}
