plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'org.jetbrains.kotlin.plugin.compose' }
android {
 namespace 'com.snowglobe.overlay'
 compileSdk 36
 defaultConfig { applicationId 'com.snowglobe.overlay'; minSdk 26; targetSdk 36; versionCode 9; versionName '0.9.0' }
 buildFeatures { compose true }
 dependencies { implementation platform('androidx.compose:compose-bom:2025.05.01'); implementation 'androidx.activity:activity-compose:1.10.1'; implementation 'androidx.compose.ui:ui'; implementation 'androidx.compose.foundation:foundation'; implementation 'androidx.compose.material3:material3'; implementation 'androidx.compose.animation:animation' }
 kotlinOptions { jvmTarget = '17' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 signingConfigs {
   release {
     if (System.getenv('PLAY_STORE_FILE')) {
       storeFile file(System.getenv('PLAY_STORE_FILE'))
       storePassword System.getenv('PLAY_STORE_PASSWORD')
       keyAlias System.getenv('PLAY_KEY_ALIAS')
       keyPassword System.getenv('PLAY_KEY_PASSWORD')
     }
   }
 }
 buildTypes {
   release {
     signingConfig signingConfigs.release
     minifyEnabled false
   }
 }
}
