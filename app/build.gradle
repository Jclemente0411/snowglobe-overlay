plugins { id 'com.android.application' }
android {
 namespace 'com.snowglobe.overlay'
 compileSdk 36
 defaultConfig { applicationId 'com.snowglobe.overlay'; minSdk 26; targetSdk 36; versionCode 6; versionName '0.6.0' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 signingConfigs {
   release {
     if (System.getenv('PLAY_STORE_FILE')) {
       storeFile file(System.getenv('PLAY_STORE_FILE'))
       storePassword System.getenv('PLAY_STORE_PASSWORD')
       keyAlias System.getenv('PLAY_KEY_ALIAS')
       keyPassword System.getenv('PLAY_KEY_PASSWORD')
     }
   }
 }
 buildTypes {
   release {
     signingConfig signingConfigs.release
     minifyEnabled false
   }
 }
}
