name: Pixel 0.15 development checks
on:
  push:
    branches: [feature/pixel-studio-015]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pixel-015-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile, run unit tests, and lint
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pixel-015-checks-${{ github.run_number }}
          path: |
            app/build/test-results/
            app/build/reports/
          retention-days: 14
      # Deliberately no signing, release upload or store deployment in this development workflow.
