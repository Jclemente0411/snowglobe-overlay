name: Build Google Play Internal AAB
on:
  workflow_dispatch:
  push:
    branches: [feature/play-internal-aab]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          for key in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing signing secret: $key"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload-key.jks"
          test -s "$RUNNER_TEMP/upload-key.jks"
      - name: Build signed release bundle and lint
        env:
          PLAY_STORE_FILE: ${{ runner.temp }}/upload-key.jks
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          ./gradle-8.9/bin/gradle --no-daemon :app:bundleRelease :app:lintRelease
          test -s app/build/outputs/bundle/release/app-release.aab
      - name: Verify release AAB signature and wallpaper registration
        run: |
          test -s app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tee /tmp/aab-signature-check.txt
          grep -q 'jar verified' /tmp/aab-signature-check.txt
          grep -q 'android.permission.BIND_WALLPAPER' app/src/main/AndroidManifest.xml
          grep -q 'android.service.wallpaper.WallpaperService' app/src/main/AndroidManifest.xml
          grep -q 'versionCode 12' app/build.gradle
          grep -q "versionName '0.12.0'" app/build.gradle
      - uses: actions/upload-artifact@v4
        with:
          name: SnowGlobe-play-internal-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
