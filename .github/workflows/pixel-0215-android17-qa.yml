name: SnowGlobe 0.21.5 Android 17 Compatibility QA
on:
  workflow_dispatch:
  push:
    branches: [feature/pixel-0215-android17-qa]
permissions:
  contents: read
concurrency:
  group: snowglobe-0215-android17-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Unit, renderer and UI verification
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false
      - name: Unit tests and lint
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :tap-probe:assembleDebug
      - name: Enable emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Render and UI tests on Android 17
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '37.0'
          system-image-api-level: '37.0'
          channel: stable
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disk-size: 4096M
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 900
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            # Android 17 userdata is credential-encrypted until primary user unlock.
            # Do not misclassify an unopened emulator as application test failures.
            for attempt in $(seq 1 90); do
              adb shell input keyevent KEYCODE_WAKEUP || true
              adb shell input keyevent 82 || true
              adb shell wm dismiss-keyguard || true
              if adb shell dumpsys user | grep -q 'RUNNING_UNLOCKED'; then break; fi
              sleep 2
            done
            adb shell dumpsys user | grep 'RUNNING_UNLOCKED' || {
              echo "::error::Android 17 emulator primary user never unlocked"; exit 1;
            }
            bash scripts/run_device_checks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SnowGlobe-android17-evidence-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            qa-screenshots/
          retention-days: 14