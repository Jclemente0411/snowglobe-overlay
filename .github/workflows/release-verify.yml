name: SnowGlobe release verification and signed AAB
on:
  workflow_dispatch:
    inputs:
      require_paid_commerce:
        description: 'Require a configured licensing key (does not prove a real purchase)'
        type: boolean
        default: false
  push:
    branches: [main, fix/ship-readiness-0216, fix/0223-touch-upgrade]
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
permissions:
  contents: read
  actions: read
concurrency:
  group: snowglobe-release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  quality:
    name: Android ${{ matrix.android }} tests and screenshots
    env:
      PLAY_BILLING_PUBLIC_KEY: ${{ vars.PLAY_BILLING_PUBLIC_KEY }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          # Exact Google archive builds: https://developer.android.com/studio/emulator_archive
          # Isolate API 35's GLES implementation with verified Mesa llvmpipe/KVM.
          # Prior SwiftShader host crashes and Mac boot failures remain retained.
          - android: '15'
            api: '35'
            runner: ubuntu-24.04
            mesa_software: true
            emulator_build: '15917651'
            emulator_version: '37.1.11'
            # https://developer.android.com/studio/run/emulator-acceleration
            emulator_graphics: '-gpu host -feature -Vulkan'
            # Published Linux archive SHA256 (provenance; action downloads via HTTPS):
            # 95771e0ae431897b2a4bd2d97fa095f29a8b0624a7b216baf529f9306161c266
          - android: '17'
            api: '37.0'
            runner: ubuntu-24.04
            mesa_software: false
            emulator_build: '16740729'
            emulator_version: '37.2.13'
            emulator_graphics: '-gpu software'
            # Published Linux archive SHA256:
            # cbc7c3cfb83220b8a0f9c513fdab557712e74d339ec19ddffa43f23350ae9bdd
    steps:
      - uses: actions/checkout@v4
      - name: Prepare GNU command-line tools on macOS
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: bash scripts/prepare_macos_tools.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false
      - name: Release verifier regressions
        run: python3 -B -m unittest discover -s scripts/tests -v
      - name: Confirm paid-build gate rejects a missing licensing key
        run: |
          mkdir -p app/build/reports
          if gradle --no-daemon -PplayBillingPublicKey= -PrequirePaidCommerce=true help > app/build/reports/paid-gate-negative.txt 2>&1; then
            echo '::error::Paid-build gate accepted an empty key'
            exit 1
          fi
          grep -F 'Paid release blocked:' app/build/reports/paid-gate-negative.txt
      - name: Install Android tools that correctly parse dotted API levels
        run: bash scripts/install_android_cmdline_tools.sh
      - name: JVM regressions, lint and test compilation
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :tap-probe:assembleDebug
      - name: Enable emulator acceleration
        if: runner.os == 'Linux'
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Configure and verify Mesa software OpenGL
        if: matrix.mesa_software
        timeout-minutes: 5
        run: bash scripts/prepare_llvmpipe.sh
      - name: Record emulator host baseline
        run: timeout 30s bash scripts/capture_emulator_host_diagnostics.sh before-emulator || true
      - name: Real window, input, overlay and UI tests
        id: device_tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          EXPECTED_ANDROID_API: ${{ matrix.api }}
          SNOWGLOBE_AVD_NAME: test
          SNOWGLOBE_EMULATOR_BUILD: ${{ matrix.emulator_build }}
          SNOWGLOBE_EMULATOR_VERSION: ${{ matrix.emulator_version }}
          SNOWGLOBE_EXPECT_LLVMPIPE: ${{ matrix.mesa_software && '1' || '0' }}
        with:
          api-level: ${{ matrix.api }}
          system-image-api-level: ${{ matrix.api }}
          # https://github.com/ReactiveCircus/android-emulator-runner#configurations
          emulator-build: ${{ matrix.emulator_build }}
          channel: stable
          arch: x86_64
          target: google_apis
          profile: pixel_6
          avd-name: test
          disk-size: 4096M
          # API 37 phone images require at least 4 GiB; the host has ample headroom.
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 900
          disable-animations: false
          # Android 15 verifies host and device Mesa identity; Android 17 is unchanged.
          emulator-options: -no-window ${{ matrix.emulator_graphics }} -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run_device_checks.sh
      - name: Capture bounded native emulator failure details
        if: always() && runner.os == 'Linux' && steps.device_tests.outcome == 'failure'
        timeout-minutes: 2
        run: timeout --kill-after=5s 85s bash scripts/capture_emulator_native_triage.sh || true
      - name: Retain host diagnostics even when emulator startup fails
        if: always()
        run: timeout 30s bash scripts/capture_emulator_host_diagnostics.sh after-emulator || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SnowGlobe-android-${{ matrix.android }}-evidence-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            qa-screenshots/
          retention-days: 14
  bundle:
    name: Existing-key signed and verified Google Play bundle
    env:
      PLAY_BILLING_PUBLIC_KEY: ${{ vars.PLAY_BILLING_PUBLIC_KEY }}
    if: github.event_name != 'pull_request' && needs.quality.result == 'success'
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false
      - name: Restore existing upload key
        env:
          KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          for key in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            test -n "${!key}" || { echo "::error::Missing existing upload secret: $key"; exit 1; }
          done
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload-key.jks"
          test -s "$RUNNER_TEMP/upload-key.jks"
      - name: Build signed release and lint
        env:
          PLAY_STORE_FILE: ${{ runner.temp }}/upload-key.jks
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: gradle --no-daemon -PrequirePaidCommerce=${{ inputs.require_paid_commerce || false }} :app:bundleRelease :app:lintRelease :app:writeReleaseMetadata
      - name: Build the explicitly registered signed-upgrade probe
        run: gradle --no-daemon --init-script scripts/upgrade-probe.init.gradle :app:assembleDebugAndroidTest
      - name: Ensure 16 KB APK verifier is available
        run: |
          set -euo pipefail
          bash scripts/install_android_cmdline_tools.sh
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"
          test -x "$ANDROID_HOME/build-tools/36.0.0/zipalign"
      - name: Verify signature, bundle metadata and 16 KB libraries
        env:
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          mkdir -p release
          unzip -t "$AAB" > release/archive-validation.txt
          jarsigner -J-Duser.language=en -verify -strict -keystore "$RUNNER_TEMP/upload-key.jks" -storepass:env PLAY_STORE_PASSWORD "$AAB" "$PLAY_KEY_ALIAS" > release/signature-check.txt
          grep -q 'jar verified' release/signature-check.txt
          keytool -J-Duser.language=en -printcert -jarfile "$AAB" > release/upload-certificate.txt
          grep -F 'SHA256: 73:45:EE:F8:97:0F:7F:8D:E6:20:BB:F7:C0:4B:28:03:0D:F9:C2:F7:A1:D6:8B:68:E5:E0:72:C1:04:8F:48:A4' release/upload-certificate.txt
          curl --fail --location --silent --show-error https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar -o "$RUNNER_TEMP/bundletool.jar"
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$AAB" > release/bundle-validation.txt
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$AAB" --module=base > release/AndroidManifest.xml
          java -jar "$RUNNER_TEMP/bundletool.jar" dump config --bundle="$AAB" > release/bundle-config.json
          python3 scripts/verify_bundle.py app/build/reports/release-metadata.json release/AndroidManifest.xml
          python3 scripts/verify_native_libraries.py "$AAB" release/bundle-config.json > release/native-alignment.txt
          python3 - <<'PY'
          import json
          m=json.load(open('app/build/reports/release-metadata.json'))
          expected={'applicationId':'com.snowglobe.overlay','versionCode':100032,'versionName':'0.22.3','targetSdk':36}
          for key,value in expected.items():
              if m.get(key)!=value: raise SystemExit('Wrong release metadata: '+key)
          if m.get('billingProductId')!='holiday_plus_lifetime': raise SystemExit('Wrong Holiday Plus product')
          if not isinstance(m.get('commerceConfigured'),bool): raise SystemExit('Missing commerce configuration status')
          status='configured' if m['commerceConfigured'] else 'commerce-not-configured'
          open('release/commerce-status.txt','w').write(status+'\n')
          print('Holiday Plus: '+status)
          PY
          # bundletool accepts pass: or file:, not apksigner's env: syntax.
          # Keep passwords out of process arguments and remove the files on every exit.
          umask 077
          trap 'rm -f "$RUNNER_TEMP/store-pass.txt" "$RUNNER_TEMP/key-pass.txt"' EXIT
          printf '%s\n' "$PLAY_STORE_PASSWORD" > "$RUNNER_TEMP/store-pass.txt"
          printf '%s\n' "$PLAY_KEY_PASSWORD" > "$RUNNER_TEMP/key-pass.txt"
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --bundle="$AAB" --output="$RUNNER_TEMP/release.apks" --mode=universal --ks="$RUNNER_TEMP/upload-key.jks" --ks-key-alias="$PLAY_KEY_ALIAS" --ks-pass="file:$RUNNER_TEMP/store-pass.txt" --key-pass="file:$RUNNER_TEMP/key-pass.txt"
          unzip -p "$RUNNER_TEMP/release.apks" universal.apk > "$RUNNER_TEMP/universal.apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$RUNNER_TEMP/universal.apk" > release/apk-alignment.txt
          mkdir -p upgrade-inputs
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump xmltree app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk --file AndroidManifest.xml > release/upgrade-probe-manifest.txt
          grep -F 'com.snowglobe.overlay.UpgradeProbeInstrumentation' release/upgrade-probe-manifest.txt
          cp "$RUNNER_TEMP/universal.apk" upgrade-inputs/candidate.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/upload-key.jks" --ks-key-alias "$PLAY_KEY_ALIAS" --ks-pass env:PLAY_STORE_PASSWORD --key-pass env:PLAY_KEY_PASSWORD --out upgrade-inputs/probe.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose upgrade-inputs/probe.apk > release/upgrade-probe-signature.txt
          cp "$AAB" release/SnowGlobe-0.22.3-build100032.aab
          cp app/build/reports/release-metadata.json release/
          git rev-parse HEAD > release/source-commit.txt
          cd release
          sha256sum *.aab > SHA256SUMS.txt
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-key.jks" "$RUNNER_TEMP/store-pass.txt" "$RUNNER_TEMP/key-pass.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: SnowGlobe-0223-signed-AAB-${{ github.run_number }}-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: SnowGlobe-upgrade-inputs-${{ github.run_number }}-${{ github.run_attempt }}
          path: upgrade-inputs/
          if-no-files-found: error
          retention-days: 7
  signed_upgrade:
    name: Android ${{ matrix.api }} signed 0.22.2 upgrade
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: '35'
            emulator_build: '15917651'
            gpu: host
          - api: '37.0'
            emulator_build: '16740729'
            gpu: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: SnowGlobe-upgrade-inputs-${{ github.run_number }}-${{ github.run_attempt }}
          path: upgrade-inputs
      - name: Download and verify the exact delivered 0.22.2 baseline
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p upgrade-evidence
          curl --fail --location --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/Jclemente0411/snowglobe-overlay/actions/artifacts/13598571700/zip -o "$RUNNER_TEMP/baseline.zip"
          unzip -j "$RUNNER_TEMP/baseline.zip" 'SnowGlobe-0.22.2-build100031.aab' -d "$RUNNER_TEMP"
          printf '%s  %s\n' bab3bc1f2f20d86f29e8b04c2eec0e548aab120c5e65a9c27ea5e1fdb0797b24 "$RUNNER_TEMP/SnowGlobe-0.22.2-build100031.aab" | sha256sum -c - > upgrade-evidence/baseline-checksum.txt
          curl --fail --location --silent --show-error https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar -o "$RUNNER_TEMP/bundletool.jar"
          keytool -J-Duser.language=en -printcert -jarfile "$RUNNER_TEMP/SnowGlobe-0.22.2-build100031.aab" > upgrade-evidence/baseline-certificate.txt
          grep -F 'SHA256: 73:45:EE:F8:97:0F:7F:8D:E6:20:BB:F7:C0:4B:28:03:0D:F9:C2:F7:A1:D6:8B:68:E5:E0:72:C1:04:8F:48:A4' upgrade-evidence/baseline-certificate.txt
          umask 077
          trap 'rm -f "$RUNNER_TEMP/upgrade-key.jks" "$RUNNER_TEMP/store-pass.txt" "$RUNNER_TEMP/key-pass.txt"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upgrade-key.jks"
          printf '%s\n' "$PLAY_STORE_PASSWORD" > "$RUNNER_TEMP/store-pass.txt"
          printf '%s\n' "$PLAY_KEY_PASSWORD" > "$RUNNER_TEMP/key-pass.txt"
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --bundle="$RUNNER_TEMP/SnowGlobe-0.22.2-build100031.aab" --output="$RUNNER_TEMP/baseline.apks" --mode=universal --ks="$RUNNER_TEMP/upgrade-key.jks" --ks-key-alias="$PLAY_KEY_ALIAS" --ks-pass="file:$RUNNER_TEMP/store-pass.txt" --key-pass="file:$RUNNER_TEMP/key-pass.txt"
          unzip -p "$RUNNER_TEMP/baseline.apks" universal.apk > upgrade-inputs/baseline.apk
      - name: Prepare Android tools and software graphics
        run: |
          bash scripts/install_android_cmdline_tools.sh
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          if [ "${{ matrix.gpu }}" = host ]; then bash scripts/prepare_llvmpipe.sh; fi
      - name: Real signed replacement, preserving data and playback choices
        uses: reactivecircus/android-emulator-runner@v2
        env:
          UPGRADE_BASELINE_APK: upgrade-inputs/baseline.apk
          UPGRADE_CANDIDATE_APK: upgrade-inputs/candidate.apk
          UPGRADE_PROBE_APK: upgrade-inputs/probe.apk
        with:
          api-level: ${{ matrix.api }}
          system-image-api-level: ${{ matrix.api }}
          emulator-build: ${{ matrix.emulator_build }}
          channel: stable
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu ${{ matrix.gpu }} -feature -Vulkan -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run_signed_upgrade_checks.sh
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/upgrade-key.jks" "$RUNNER_TEMP/store-pass.txt" "$RUNNER_TEMP/key-pass.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SnowGlobe-signed-upgrade-${{ matrix.api }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: upgrade-evidence/
          if-no-files-found: error
          retention-days: 14
