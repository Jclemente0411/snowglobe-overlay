name: SnowGlobe Google Play Release AAB
on:
  push:
    branches: [feature/compose-holiday-release-010]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify release signing credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing PLAY_KEYSTORE_BASE64"; exit 1; }
          test -n "$PLAY_STORE_PASSWORD" || { echo "::error::Missing PLAY_STORE_PASSWORD"; exit 1; }
          test -n "$PLAY_KEY_ALIAS" || { echo "::error::Missing PLAY_KEY_ALIAS"; exit 1; }
          test -n "$PLAY_KEY_PASSWORD" || { echo "::error::Missing PLAY_KEY_PASSWORD"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/snowglobe-upload.jks"
      - name: Build signed release bundle
        env:
          PLAY_STORE_FILE: ${{ runner.temp }}/snowglobe-upload.jks
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:bundleRelease --no-daemon
          test -s app/build/outputs/bundle/release/app-release.aab
      - name: Upload Google Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: SnowGlobe-0.10.0-signed-play-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
